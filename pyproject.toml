[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "richletsgo"
version = "0.0.1"
description = "Foundations for KIS stocks and Bybit futures automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25,<26",
    "aiohttp>=3.12,<4",
    # M5-01 dashboard (D73): FastAPI + Uvicorn + Jinja2; multipart parses login/control forms.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "mypy>=1.19",
    "httpx>=0.28,<1",  # FastAPI TestClient
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["richletsgo*"]
namespaces = false

[tool.setuptools.package-data]
richletsgo_dashboard = ["templates/*.html", "static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/richletsgo", "src/richletsgo_watchdog", "src/richletsgo_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
