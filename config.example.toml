# Copy to config.local.toml for local settings. Never put secrets in TOML.
# M3 validates required fields. Demo numbers below are explicit research examples only.
environment = "backtest" # backtest / demo / live

[bybit]
category = "linear"
symbols = ["BTCUSDT", "ETHUSDT"]

leverage = "3"
position_idx = 0
margin_mode = "ISOLATED_MARGIN"
api_created_at = "2026-10-26T00:00:00Z" # replace with actual demo key issue time
recv_window_ms = 5000
timeout_seconds = 10
retry_attempts = 3
retry_delay_seconds = 1
clock_limit_ms = 1000
clock_check_seconds = 60
ws_ping_seconds = 20
ws_backoff_seconds = 1
ws_max_backoff_seconds = 60
page_limit = 50
trigger_by = "LastPrice"

[bybit.demo]
rest_url = "https://api-demo.bybit.com"
private_ws_url = "wss://stream-demo.bybit.com/v5/private"

[risk]
# Explicit DEMO research examples (D88); live is refused by M3.
risk_per_trade = "0.01"
daily_loss_limit_usdt = "300"
max_drawdown_ratio = "0.15"
strategy_allocations = { S1 = "0.6", S2 = "0.4" }
consecutive_loss_limit = 4
cooldown_hours = 12
max_leverage = "3"
max_symbol_notional_usdt = "20000"
max_account_notional_usdt = "30000"
liquidation_buffer_ratio = "0.5"
slippage_buffer = "0.001"
resume_equity_tolerance_ratio = "0.01"
# Q13 is undecided. No trading defaults are provided.
# See docs/design/02_RISK_MANAGEMENT.md, sections 2-3 and Q13.
# risk_per_trade = <user decision>
# daily_loss_limit_usdt = <user decision>
# max_drawdown_ratio = <user decision>
# resume_equity_tolerance_ratio = <user decision> # required, 0 <= ratio < 1; no default
# strategy_allocations = <user decision>
# consecutive_loss_limit = <user decision>
# cooldown_hours = <user decision>
# max_leverage = <user decision>
# max_symbol_notional_usdt = <user decision>
# max_account_notional_usdt = <user decision>
# liquidation_buffer_ratio = <user decision>

[keystore]
# Windows Credential Manager entry names only, never key/token/password values.
bybit_demo_api = "richletsgo/bybit-demo"
bybit_live_api = "richletsgo/bybit-live"
telegram_bot = "richletsgo/telegram-bot"
oracle_demo = "richletsgo/oracle-demo"
oracle_live = "richletsgo/oracle-live"
oracle_read = "richletsgo/oracle-read"

# Future loader (M3): paths are relative to THIS config file, never cwd.
# Example values; keep environments separate.

[bybit_public]
# Public market data for backtests (M2-01). No API key. Mainnet REST base URL.
base_url = "https://api.bybit.com"
ws_url = "wss://stream.bybit.com/v5/public/linear"

[backtest.research_risk]
# D88 research profile for V1 backtests only - NOT live trading values (Q13 stays open).
start_equity_usdt = "10000"
risk_per_trade = "0.01"
daily_loss_limit_usdt = "300"
max_drawdown_ratio = "0.15"
strategy_allocations = { S1 = "0.6", S2 = "0.4" }
consecutive_loss_limit = 4
cooldown_hours = 12
max_leverage = "3"
max_symbol_notional_usdt = "20000"
max_account_notional_usdt = "30000"
liquidation_buffer_ratio = "0.5"
slippage_buffer = "0.001"
resume_equity_tolerance_ratio = "0.01"
taker_fee_rate = "0.00055"  # Bybit standard VIP 0 futures rate checked 2026-10-23 (research only)
maker_fee_rate = "0.0002"
slippage_rate = "0.0002"

[backtest.selection]
# D80/D88
drawdown_floor_usdt = "100"
min_training_trades = { S1 = 6, S2 = 50 }
max_invalid_window_ratio = "0.25"
max_grid_points = 24  # D91: joint S1xS2 grid kept small (e.g. S1 4 x S2 6)

[paths.backtest]
market_data_dir = "data/backtest/market_data"
journal_dir = "data/backtest/journal"
log_dir = "logs/backtest"
backup_dir = "backups/backtest"
backtest_results_dir = "backtest_results/backtest"

[paths.demo]
journal_dir = "data/demo/journal"
log_dir = "logs/demo"
backup_dir = "backups/demo"

[paths.live]
journal_dir = "data/live/journal"
log_dir = "logs/live"
backup_dir = "backups/live"


[backtest.execution]
# Research coordinator settings, separate from risk limits and M2-04 selection.
max_close_attempts = 3
max_protect_attempts = 3
retry_after_seconds = 5
trigger_by = "LastPrice"
history_window_seconds = 604800
overlap_seconds = 300
unknown_alert_after_seconds = 20
cancel_retry_after_seconds = 5
max_sync_rounds = 3

[backtest.walkforward]
# Research example: fixed closed UTC range, never a moving "now" boundary.
start = "2023-10-01T00:00:00Z"
end = "2026-10-01T00:00:00Z"
train_months = 12
test_months = 3
workers = 4
parallel_efficiency = "0.8"
per_run_seconds_12m = "84"
measurement_source = "M2-03 synthetic S1A(5,20,10)/S2A(20,2,14,2,24), 2026-10-23, one process"
max_compute_hours = "6"
reestimate_after = 4

[backtest.pass_criteria]
# D88 V1 research thresholds; omit this table for UNSET.
min_net_pnl_usdt = "0"
max_drawdown_ratio = "0.15"

[backtest.grid]
# Explicit small joint grids: two candidates per family, four pairs per combination.
S1A = [
  { fast = 5, slow = 20, exit_channel = 10 },
  { fast = 10, slow = 40, exit_channel = 20 },
]
S1B = [
  { entry_channel = 20, exit_channel = 10 },
  { entry_channel = 40, exit_channel = 20 },
]
S2A = [
  { period = 20, k = "2", atr_period = 14, atr_multiple = "2", max_hold_bars = 24 },
  { period = 20, k = "1.5", atr_period = 14, atr_multiple = "2", max_hold_bars = 24 },
]
S2B = [
  { period = 14, low = "30", high = "70", neutral = "50", atr_period = 14, atr_multiple = "2", max_hold_bars = 24 },
  { period = 14, low = "35", high = "65", neutral = "50", atr_period = 14, atr_multiple = "2", max_hold_bars = 24 },
]

[ai]
mode = "disabled"

[telegram]
allowed_user_ids = [1] # replace with actual numeric user IDs before connection

[oracle]
working_set_days = 7
[oracle.backtest]
dsn = "localhost:1521/FREEPDB1"
schema = "RLG_BACKTEST"
[oracle.demo]
dsn = "localhost:1521/FREEPDB1"
schema = "RLG_DEMO"

[logging]
retention_days = 14

# Old candidates are for offline/connection development only, NOT D94 demo approval.
[strategy.S1]
candidate = "S1-A"
source = "manual"
params = { fast = 5, slow = 20, exit_channel = 10 }
[strategy.S2]
candidate = "S2-A"
source = "manual"
params = { period = 20, k = "2", atr_period = 14, atr_multiple = "2", max_hold_bars = 24 }
